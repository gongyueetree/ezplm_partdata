# 分类规则层。三类规则，命中即给出候选分类 + 置信度：
#   keyword  : 描述/型号中出现关键词（正则，忽略大小写） -> 分类名（叶子名；重名时写 "父 > 叶子"）
#   mpn      : 制造商 + 型号前缀正则 -> 分类名
#   symbol_lib : KiCad 符号所在库名前缀 -> 允许的分类根/叶子（交叉验证用）
# 规则按顺序匹配，先命中者优先；conf 为该规则的置信度。
keyword:
  - {pattern: "动态随机存取存储器|DRAM|SDRAM|DDR[2-5]?|LPDDR", exclude: "缓冲器|驱动器|控制器|寄存器|时钟|Buffer|Controller|Register", category: "存储器 > 存储器", conf: 0.95}
  - {pattern: "NAND\\s*Flash|NOR\\s*Flash|EEPROM|SRAM|PSRAM|OctalRAM|FRAM|MRAM|随机存取存储器|闪存存储器", exclude: "微控制器|单片机|MCU|Microcontroller|微处理器|Processor|FPGA|CPLD|Cortex|RISC-V|DSP|SoC|模组|模块|Module|开发板", category: "存储器 > 存储器", conf: 0.92}
  - {pattern: "数字隔离器", category: "数字隔离器", conf: 0.95}
  - {pattern: "光耦|光隔离器|光电耦合", category: "光隔离器", conf: 0.85}
  - {pattern: "微控制器|\\bMCU\\b|Cortex-M|RISC-V 内核", category: "微控制器（MCU）", conf: 0.9}
  - {pattern: "现场可编程门阵列|\\bFPGA\\b", category: "FPGA（现场可编程门阵列）", conf: 0.9}
  - {pattern: "带微控制器的 FPGA|集成微控制器的现场可编程", category: "带微控制器的 FPGA（现场可编程门阵列）", conf: 0.95}
  - {pattern: "齐纳二极管|稳压二极管|Zener", category: "单齐纳二极管", conf: 0.9}
  - {pattern: "TVS|瞬态电压抑制", category: "TVS 二极管", conf: 0.9}
  - {pattern: "肖特基|整流二极管|快恢复二极管|Schottky", category: "单二极管", conf: 0.85}
  - {pattern: "双 ?[NP] ?沟道|Dual.*MOSFET|MOSFET 阵列", category: "FET、MOSFET 阵列", conf: 0.9}
  - {pattern: "[NP] ?沟道.*MOSFET|MOSFET.*[NP] ?沟道|MOSFET.*(DPAK|SOT|TO-)", category: "单 FET，MOSFET", conf: 0.88}
  - {pattern: "\\bIGBT\\b", category: "单 IGBT", conf: 0.8}
  - {pattern: "NPN|PNP|双极晶体管|BJT", category: "单双极晶体管", conf: 0.8}
  - {pattern: "LDO|线性稳压器|低压差", category: "稳压器 - 线性稳压器控制器", conf: 0.6}
  - {pattern: "DC[/-]?DC.*(转换器|稳压|开关)|降压|升压|Buck|Boost", category: "稳压器 - DC-DC 开关稳压器", conf: 0.85}
  - {pattern: "电压基准|基准电压", category: "电压基准", conf: 0.9}
  - {pattern: "运算放大器|运放|仪表放大器|Op ?Amp", category: "仪器，运算放大器，缓冲器", conf: 0.85}
  - {pattern: "比较器", category: "线性 > 比较器", conf: 0.8}
  - {pattern: "模数转换器|\\bADC\\b", category: "模数转换器（ADC）", conf: 0.85}
  - {pattern: "数模转换器|\\bDAC\\b", category: "数模转换器（DAC）", conf: 0.85}
  - {pattern: "时钟发生器|频率合成器|\\bPLL\\b|扇出缓冲器|时钟缓冲", category: "时钟发生器，PLL，频率合成器", conf: 0.85}
  - {pattern: "实时时钟|\\bRTC\\b", category: "实时时钟", conf: 0.9}
  - {pattern: "旋转编码器|光学编码器|PPR", category: "编码器", conf: 0.9}
  - {pattern: "射频.*滤波器|RF ?滤波器|带通.*滤波|低通.*滤波|高通.*滤波", category: "RF 滤波器", conf: 0.9}
  - {pattern: "SAW 滤波器|声表面波", category: "SAW 滤波器", conf: 0.9}
  - {pattern: "数据缓冲器|总线收发器|线路驱动器|缓冲器.*收发", category: "缓冲器，驱动器，接收器，收发器", conf: 0.75}
  - {pattern: "RS-?485|RS-?232|RS-?422", category: "RS232，RS422，RS485总线接口", conf: 0.9}
  - {pattern: "\\bCAN\\b.*(收发|接口|控制)", category: "CAN接口", conf: 0.9}
  - {pattern: "以太网.*(PHY|收发|交换)|Ethernet", category: "以太网接口器件", conf: 0.85}
  - {pattern: "USB.*(集线器|控制器|桥接|收发|PHY)", category: "USB IC", conf: 0.8}
  - {pattern: "霍尔", category: "霍尔效应传感器", conf: 0.9}
  - {pattern: "温度传感器|温度计", category: "模拟和数字输出", conf: 0.7}
  - {pattern: "加速度计|加速计", category: "加速计", conf: 0.9}
  - {pattern: "陀螺仪", category: "陀螺仪", conf: 0.9}
  - {pattern: "\\bIMU\\b|惯性测量", category: "IMU（惯性测量装置）", conf: 0.9}
  - {pattern: "栅极驱动|Gate Driver", category: "栅极驱动器", conf: 0.85}
  - {pattern: "LED ?驱动", category: "电源管理（PMIC） > LED 驱动器", conf: 0.8}
  - {pattern: "电机驱动|步进.*驱动|无刷.*驱动", category: "电机驱动器，控制器", conf: 0.85}
  - {pattern: "电池充电|充电管理|充电器 IC", category: "电池充电器", conf: 0.85}
  - {pattern: "电源开关|负载开关|配电开关|eFuse", category: "电源开关，配电开关，负载驱动器", conf: 0.85}
  - {pattern: "固定电感|功率电感|贴片电感", category: "固定电感器", conf: 0.85}
  - {pattern: "多层陶瓷电容|MLCC|陶瓷电容", category: "陶瓷电容器", conf: 0.9}
  - {pattern: "铝电解电容", category: "铝电解电容器", conf: 0.9}
  - {pattern: "钽电容", category: "钽电容器", conf: 0.9}
  - {pattern: "贴片电阻|厚膜电阻|薄膜电阻|片式电阻", category: "片式贴装电阻器", conf: 0.9}
  - {pattern: "晶体谐振器|无源晶振|石英晶体", category: "晶体（无源晶振）", conf: 0.9}
  - {pattern: "有源晶振|晶体振荡器|时钟振荡器", category: "振荡器（有源晶振）", conf: 0.9}
  - {pattern: "排针", category: "排针", conf: 0.9}
  - {pattern: "排母", category: "排母", conf: 0.9}
  - {pattern: "Type-?C|USB 连接器|USB连接器", category: "USB连接器", conf: 0.9}

mpn:
  - {manufacturer: "STMicro", pattern: "^STM32", category: "微控制器（MCU）", conf: 0.97}
  - {manufacturer: "STMicro", pattern: "^STM8", category: "微控制器（MCU）", conf: 0.97}
  - {manufacturer: "Texas Instruments", pattern: "^ISO(W)?7", category: "数字隔离器", conf: 0.93}
  - {manufacturer: "Texas Instruments", pattern: "^TPS7", category: "稳压器 - 线性稳压器控制器", conf: 0.7}
  - {manufacturer: "Texas Instruments", pattern: "^TPS(5|6)", category: "稳压器 - DC-DC 开关稳压器", conf: 0.8}
  - {manufacturer: "Texas Instruments", pattern: "^MSP430", category: "微控制器（MCU）", conf: 0.97}
  - {manufacturer: "Texas Instruments|Infineon", pattern: "^CY2[0-9]", category: "时钟发生器，PLL，频率合成器", conf: 0.85}
  - {manufacturer: "Infineon", pattern: "^CY8C", category: "微控制器（MCU）", conf: 0.95}
  - {manufacturer: "Infineon", pattern: "^(AU)?IRF", category: "单 FET，MOSFET", conf: 0.93}
  - {manufacturer: "Diodes", pattern: "^DM[NP]\\d.*DB", category: "FET、MOSFET 阵列", conf: 0.85}
  - {manufacturer: "Diodes", pattern: "^DM[NP]\\d", category: "单 FET，MOSFET", conf: 0.85}
  - {manufacturer: "Micron|美光", pattern: "^MT4|^MT5|^MT6", category: "存储器 > 存储器", conf: 0.95}
  - {manufacturer: "Micron|美光", pattern: "^MT2|^MT29", category: "存储器 > 存储器", conf: 0.95}
  - {manufacturer: "ISSI|Integrated Silicon", pattern: "^IS4|^IS6", category: "存储器 > 存储器", conf: 0.95}
  - {manufacturer: "Winbond|华邦", pattern: "^W25|^W9", category: "存储器 > 存储器", conf: 0.95}
  - {manufacturer: "兆易|GigaDevice", pattern: "^GD25|^GD5", category: "存储器 > 存储器", conf: 0.95}
  - {manufacturer: "兆易|GigaDevice", pattern: "^GD32", category: "微控制器（MCU）", conf: 0.97}
  - {manufacturer: "乐鑫|Espressif", pattern: "^ESP(32|8266)(?!.*-(WROOM|WROVER|MINI|DevKit))", category: "无线微控制器（MCU）", conf: 0.95}
  - {manufacturer: "乐鑫|Espressif", pattern: "^ESP(32|8266).*-(WROOM|WROVER|MINI)", category: "无线通信专用模块", conf: 0.95}
  - {manufacturer: "Microchip", pattern: "^(PIC|ATMEGA|ATTINY|ATSAM|dsPIC)", category: "微控制器（MCU）", conf: 0.95}
  - {manufacturer: "Microchip", pattern: "^MIC5|^MCP17", category: "稳压器 - 线性稳压器控制器", conf: 0.7}
  - {manufacturer: "Torex|特瑞仕", pattern: "^XC92|^XC93", category: "稳压器 - DC-DC 开关稳压器", conf: 0.85}
  - {manufacturer: "Torex|特瑞仕", pattern: "^XC62|^XC64", category: "稳压器 - 线性稳压器控制器", conf: 0.8}
  - {manufacturer: "Vishay", pattern: "^ZGL41|^BZX|^BZT", category: "单齐纳二极管", conf: 0.9}
  - {manufacturer: "Rohm|罗姆", pattern: "^RLZ|^MTZJ|^UDZ|^KDZ", category: "单齐纳二极管", conf: 0.9}
  - {manufacturer: "Mini-Circuits", pattern: "^(VLF|ZVBP|ZX75|BFCN|LFCN|HFCN|SXBP)", category: "RF 滤波器", conf: 0.9}
  - {manufacturer: "AVX|Kyocera", pattern: "^(BP|HF|LP)0", category: "RF 滤波器", conf: 0.85}
  - {manufacturer: "Broadcom|Grayhill|Bourns", pattern: "^(AEDC|62M|ENT)", category: "编码器", conf: 0.85}
  - {manufacturer: "Nexperia|NXP", pattern: "^74(HC|LV|AHC|AUP)", category: "门和反相器", conf: 0.5}

# KiCad 符号库名前缀 → 允许的分类（根或叶子名）。器件已有符号时，用它校验物料分类是否自洽。
symbol_lib:
  Transistor_FET: ["晶体管"]
  Transistor_BJT: ["晶体管"]
  Transistor_IGBT: ["晶体管"]
  Diode: ["二极管", "电路保护"]
  Isolator: ["隔离器"]
  Regulator_Linear: ["电源管理（PMIC）"]
  Regulator_Switching: ["电源管理（PMIC）"]
  Regulator_Controller: ["电源管理（PMIC）"]
  Reference_Voltage: ["电压基准"]
  Amplifier_Operational: ["放大器"]
  Comparator: ["比较器"]
  Memory_RAM: ["存储器"]
  Memory_Flash: ["存储器"]
  Memory_EEPROM: ["存储器"]
  MCU_: ["嵌入式"]
  Interface_: ["接口"]
  Analog_ADC: ["数据采集"]
  Analog_DAC: ["数据采集"]
  Oscillator: ["晶体，振荡器，谐振器"]
  Timer_RTC: ["时钟_定时"]
  Sensor_: ["传感器，变送器"]
  Connector: ["连接器，互连器件"]
  Device: []
