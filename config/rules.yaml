# 分类规则层。三类规则，命中即给出候选分类 + 置信度：
#   keyword  : 描述/型号中出现关键词（正则，忽略大小写） -> 分类名（叶子名；重名时写 "父 > 叶子"）
#   mpn      : 制造商 + 型号前缀正则 -> 分类名
#   symbol_lib : KiCad 符号所在库名前缀 -> 允许的分类根/叶子（交叉验证用）
# 规则按顺序匹配，先命中者优先；conf 为该规则的置信度。
# no_flag：原分类 → 建议分类 匹配这些（正则，对完整路径）时，不判"疑似错误"。
# 多是"从更细的分类挪到更笼统的分类"：规则只认通用关键词，不知道原分类已经更具体。
# hold：命中的物料不出分类建议，只打标签（ezPLM 分类树里还没有合适的叶子分类，近邻只会乱猜）
hold:
  # 隔离电源模块（金升阳 URB/WRB/H…、致远、恒率；"输出功率 … 转换效率" 或 "转换类型：AC-DC/DC-DC"）
  - {pattern: "输出功率[:：].{0,40}转换效率|转换类型[:：] ?(AC|DC)-DC|电源模块|隔离电源", tag: "电源模块（缺分类）"}

no_flag:
  - {current: "预偏置", proposed: "单双极晶体管"}
  - {current: "阵列", proposed: "单二极管|单 FET|单双极晶体管|单 IGBT"}
  - {current: "应用特定微控制器", proposed: "微控制器（MCU）$"}
  - {current: "LED 驱动器", proposed: "DC-DC 开关稳压器|DC-DC 开关控制器"}
  - {current: "片上系统", proposed: "FPGA"}
  - {current: "微处理器|微控制器|片上系统|DSP|FPGA", proposed: "存储器"}
  - {current: "存储器 - 模块", proposed: "存储器 > 存储器$"}
  # 隔离式 CAN/RS-485/I²C/USB 收发器：ezPLM 分类树照 DigiKey，归在数字隔离器下（类型标 CAN 等）
  - {current: "数字隔离器", proposed: "CAN|RS232|RS422|RS485|I2C|I²C|USB|驱动器，接收器，收发器"}
keyword:
  # 处理器描述里常见"支持 DDR2/3 内存"（MPC8536 等被判成存储器），排除处理器类描述
  # 型号里也会出现 DRAM 字样（SICK 料位开关 LBV320-XXTGDRAMX01100 被判成存储器）：英文缩写前后不能紧挨字母/数字
  # （不用 \\b：中文也算单词字符，"DDR3内存" 之间没有 \\b）
  - {pattern: "动态随机存取存储器|(?<![A-Za-z0-9])(DRAM|SDRAM|DDR[2-5]?L?|LPDDR[2-5]?X?)(?![A-Za-z0-9])", exclude: "缓冲器|驱动器|控制器|寄存器|时钟|Buffer|Controller|Register|处理器|Processor|CPU|主频|内核|核心|PowerQUICC|QorIQ|片上系统|SoC|微控制器|MCU|FPGA|模块|模组|内存条|DIMM|Module|\\d{3} ?针", category: "存储器 > 存储器", conf: 0.95}
  # 缩写加 ASCII 边界："FRAM" 曾命中 "FRAME"（屏蔽罩框架 BMI-S-209-F）
  - {pattern: "NAND\\s*Flash|NOR\\s*Flash|(?<![A-Za-z])(EEPROM|SRAM|PSRAM|OctalRAM|FRAM|MRAM)(?![A-Za-z])|随机存取存储器|闪存存储器", exclude: "屏蔽|Shield|微控制器|单片机|MCU|Microcontroller|微处理器|Processor|FPGA|CPLD|Cortex|RISC-V|DSP|SoC|模组|模块|Module|开发板", category: "存储器 > 存储器", conf: 0.92}
  - {pattern: "数字隔离器", category: "数字隔离器", conf: 0.95}
  - {pattern: "光耦|光隔离器|光电耦合", category: "光隔离器", conf: 0.85}
  - {pattern: "微控制器|\\bMCU\\b|Cortex-M|RISC-V 内核", category: "微控制器（MCU）", conf: 0.9}
  # Zynq MPSoC/RFSoC 这类"处理器 + FPGA"的器件按 SoC 归类，不触发 FPGA 规则
  - {pattern: "现场可编程门阵列|\\bFPGA\\b", exclude: "片上系统|SoC|MPSoC|RFSoC|Cortex-A|A53|处理器", category: "FPGA（现场可编程门阵列）", conf: 0.9}
  - {pattern: "带微控制器的 FPGA|集成微控制器的现场可编程", category: "带微控制器的 FPGA（现场可编程门阵列）", conf: 0.95}
  - {pattern: "齐纳二极管|稳压二极管|Zener", category: "单齐纳二极管", conf: 0.9}
  - {pattern: "TVS|瞬态电压抑制|transient voltage suppress", category: "TVS 二极管", conf: 0.9}
  - {pattern: "肖特基|整流二极管|快恢复二极管|Schottky", category: "单二极管", conf: 0.85}
  - {pattern: "双 ?[NP] ?沟道|Dual.*MOSFET|MOSFET 阵列", category: "FET、MOSFET 阵列", conf: 0.9}
  - {pattern: "[NP] ?沟道.*MOSFET|MOSFET.*[NP] ?沟道|MOSFET.*(DPAK|SOT|TO-)", exclude: "双 ?[NP]|Dual|阵列|Array|驱动器|Driver", category: "单 FET，MOSFET", conf: 0.88}
  - {pattern: "\\bIGBT\\b", category: "单 IGBT", conf: 0.8}
  # 射频放大器（Qorvo QPA/SGL 这类"硅锗异质结双极晶体管放大器"MMIC）不是分立 BJT；要有频率/射频字样，"NPN 通用放大器"不算
  - {pattern: "(\\d\\s*[MG]Hz|射频|微波|RF).{0,40}放大器|低噪声放大器|(?<![A-Za-z])(LNA|MMIC)(?![A-Za-z])|增益模块|Gain Block", exclude: "运算放大器|运放|音频|仪表放大|差分放大器|功率放大器模块", category: "射频和无线 > 射频放大器", conf: 0.85}
  - {pattern: "(双|多芯片|Dual).{0,6}(NPN|PNP)|(NPN|PNP).{0,10}(多芯片|阵列|Array)|(NPN|PNP) ?\\+ ?(NPN|PNP)", exclude: "预偏置|偏置电阻|带电阻|内置电阻|数字晶体管", category: "双极晶体管阵列", conf: 0.85, desc_only: true}
  # 只写"开关晶体管/小信号晶体管"不写 NPN/PNP 的（罗姆 UMT3904、SST3906、2SA2094）；MOS/数字(带电阻)晶体管/IGBT/光电除外
  - {pattern: "(开关|小信号|中功率|大功率|功率|高频|低频|通用|高压|低饱和)晶体管|达林顿", exclude: "MOS|FET|场效应|预偏置|数字晶体管|内置电阻|带电阻|IGBT|光电|光敏|阵列|双|复合", category: "单双极晶体管", conf: 0.85, desc_only: true}
  # NPN/PNP 只看描述（型号 PNP3806 之类不是晶体管），且要有边界
  - {pattern: "(?<![A-Za-z])(NPN|PNP|BJT)(?![A-Za-z])|双极晶体管", exclude: "预偏置|偏置电阻|带电阻|内置电阻|数字晶体管|阵列|多芯片|双 ?NPN|双 ?PNP|(NPN|PNP) ?\\+ ?(NPN|PNP)|调节器|稳压器|Regulator|Dual|Array|MHz|GHz|射频|微波|异质结|MMIC|放大器模块", category: "单双极晶体管", conf: 0.8, desc_only: true}
  # LDO：ezPLM 没有单独的"线性稳压器"分类，先归"线性稳压器控制器"（用户确认）。
  # 也认 DigiKey 线性稳压器的参数模板（"输出类型：固定 输出极性：正 最大输入电压…"、PSRR、压降），开关稳压器模板带"拓扑/开关频率"，排除
  - {pattern: "(?<![A-Za-z])LDO(?![A-Za-z])|线性稳压器|低压差|输出类型[:：] ?(固定|可调).{0,12}输出极性|输出极性[:：] ?[正负].{0,6}最大输入电压|电源纹波抑制比|PSRR|压降（最大值）", exclude: "拓扑|开关频率|频率 ?- ?开关|降压|升压|Buck|Boost|DC-?DC|开关稳压|控制器（外置|基准", category: "稳压器 - 线性稳压器控制器", conf: 0.84}
  # 排除电源模块（如 "DC/DC转换器 – 机箱安装型 120W …8thBrick"）：它们不是 IC，交给近邻/LLM/人工
  # LED 驱动（"LED 升压控制器""Buck LED Driver""LED降压恒流驱动"）归 LED 驱动器；外置开关管的"控制器"归 DC-DC 开关控制器
  # 以下几类描述里常带"降压/升压/Boost/DC-DC"，排在 DC-DC 规则前面，DC-DC 规则也排除它们：
  # MOSFET 驱动器（ISL6612/6208/6625"同步整流降压MOSFET驱动器"）、音频功放（AW88xx "Smart Boost…功放"）、充电芯片（SC8815/8902"升降压充电转换器"）
  - {pattern: "电荷泵|充电泵|Charge Pump", exclude: "充电器|电池充电", category: "电源管理（PMIC） > 电荷泵", conf: 0.85}
  - {pattern: "MOSFET ?(栅极)?驱动器|MOSFET Driver|栅极驱动|Gate Driver|驱动配置[:：]|负载类型[:：] ?MOSFET", exclude: "隔离", category: "电源管理（PMIC） > 栅极驱动器", conf: 0.85}
  - {pattern: "功放|音频放大|Audio Amp|Class.?D 放大", category: "放大器 > 音频放大器", conf: 0.88}
  - {pattern: "电池充电|充电管理|充电器 IC|充电(转换器|控制|芯片|IC)|(开关|线性|升压|降压|升降压|锂电池?|锂离子)充电|Battery Charg|Charger IC", exclude: "无线充电|USB ?PD|充电泵|电荷泵", category: "电池充电器", conf: 0.85}
  # 数码管/点阵 LED 显示驱动（TM1668/1629/1651 这类"共阴极 N 段 M 位 + 键盘扫描"）归显示驱动器，不归照明用 LED 驱动器
  - {pattern: "数码管|(\\d|七|八)段|共阴|共阳|键盘扫描|点阵|LED ?矩阵|LED Matrix|LED Display Driver|显示驱动", exclude: "LCD|液晶|背光", category: "电源管理（PMIC） > 显示驱动器", conf: 0.88}
  - {pattern: "LED.{0,15}(驱动|Driver|控制器|Controller)|恒流驱动", exclude: "显示|LCD|数码管|点阵|矩阵|Matrix|Display|(\\d|七|八)段|共阴|共阳|键盘扫描", category: "电源管理（PMIC） > LED 驱动器", conf: 0.85}
  - {pattern: "(DC[/-]?DC|降压|升压|Buck|Boost).{0,12}(控制器|Controller)", exclude: "通孔型|表面贴装型|电荷泵|平滑|\\d+ ?小时|充电(?!泵)|功放|音频|Audio|MOSFET ?驱动|MOSFET Driver|电容|Capacitor|沟槽|Trench|MOS技术|[μµu]Module|LED|模块|机箱安装|板安装|[Bb]rick|砖", category: "DC-DC 开关控制器", conf: 0.85}
  - {pattern: "DC[/-]?DC.*(转换器|稳压|开关)|降压|升压|Buck|Boost", exclude: "通孔型|表面贴装型|电荷泵|充电泵|Charge Pump|平滑|\\d+ ?小时|充电(?!泵)|功放|音频|Audio|MOSFET ?驱动|MOSFET Driver|电容|Capacitor|沟槽|Trench|MOS技术|[μµu]Module|LED|控制器|Controller|模块|机箱安装|板安装|[Bb]rick|砖", category: "稳压器 - DC-DC 开关稳压器", conf: 0.85}
  - {pattern: "电压基准|基准电压", category: "电压基准", conf: 0.9}
  # 串联电压基准的参数模板（"输出类型：固定 … 输出电流：5mA 精度：±0.5%"，LM4120/AD1585/MAX6068），LDO 模板带"输出极性/压降/PSRR"
  - {pattern: "精度[:：] ?±\\s*\\d", exclude: "输出极性|压降|PSRR|纹波|拓扑|输出功率|转换效率|电流检测|温度", category: "电压基准", conf: 0.85}
  # 电压检测/复位芯片（APX803、TPS38x、MAX809 一类）：近邻常把它们猜成电压基准
  - {pattern: "电压检测器|电压监测器|电压监控器|复位芯片|复位IC|复位电路|上电复位|微处理器监控|看门狗|Supervisor|Voltage Detector|Reset IC|Watchdog", exclude: "电流|电池管理|电量|温度", category: "电源管理（PMIC） > 电源监控器", conf: 0.88}
  - {pattern: "运算放大器|运放|仪表放大器|Op ?Amp", category: "仪器，运算放大器，缓冲器", conf: 0.85}
  - {pattern: "比较器", category: "线性 > 比较器", conf: 0.8}
  - {pattern: "模数转换器|模/数.{0,8}转换器|A/D\\)? ?转换器|\\bADC\\b", category: "模数转换器（ADC）", conf: 0.85}
  - {pattern: "数模转换器|\\bDAC\\b", category: "数模转换器（DAC）", conf: 0.85}
  # 时钟缓冲/扇出/分配归"时钟缓冲器，驱动器，分配器"；带 PLL 的石英/TCXO 振荡器归有源晶振（都要排在 PLL 规则前面，先命中的生效）
  - {pattern: "时钟缓冲|扇出缓冲|扇出驱动|时钟分配|时钟驱动器|Clock (Buffer|Driver|Distribution)|Fan-?out Buffer", exclude: "零延迟|Zero.?Delay", category: "时钟缓冲器，驱动器，分配器", conf: 0.88}
  - {pattern: "有源晶振|晶体振荡器|时钟振荡器|石英.{0,12}振荡器|(?<![A-Za-z])(TCXO|OCXO|VCXO|XO)(?![A-Za-z])", exclude: "无源晶振|谐振器", category: "振荡器（有源晶振）", conf: 0.9}
  - {pattern: "时钟发生器|频率合成器|\\bPLL\\b|零延迟缓冲", exclude: "时钟缓冲|扇出缓冲|振荡器|晶振|Oscillator", category: "时钟发生器，PLL，频率合成器", conf: 0.85}
  - {pattern: "实时时钟|\\bRTC\\b", category: "实时时钟", conf: 0.9}
  # PPR（每转脉冲数）必须是独立单词：不区分大小写时 "suppressor""approximately" 里都有 ppr（TVS、触摸按键芯片曾被判成编码器）
  - {pattern: "旋转编码器|光学编码器|(?<![A-Za-z])PPR(?![A-Za-z])", category: "编码器", conf: 0.9}
  - {pattern: "射频.*滤波器|RF ?滤波器|带通.*滤波|低通.*滤波|高通.*滤波", category: "RF 滤波器", conf: 0.9}
  - {pattern: "SAW 滤波器|声表面波", category: "SAW 滤波器", conf: 0.9}
  - {pattern: "数据缓冲器|总线收发器|线路驱动器|缓冲器.*收发", category: "缓冲器，驱动器，接收器，收发器", conf: 0.75}
  - {pattern: "RS-?485|RS-?232|RS-?422", category: "RS232，RS422，RS485总线接口", conf: 0.9}
  - {pattern: "\\bCAN\\b.*(收发|接口|控制)", category: "CAN接口", conf: 0.9}
  - {pattern: "以太网.*(PHY|收发|交换)|Ethernet", category: "以太网接口器件", conf: 0.85}
  - {pattern: "USB.*(集线器|控制器|桥接|收发|PHY)", category: "USB IC", conf: 0.8}
  - {pattern: "霍尔", category: "霍尔效应传感器", conf: 0.9}
  - {pattern: "温度传感器|温度计", category: "模拟和数字输出", conf: 0.7}
  - {pattern: "加速度计|加速计", category: "加速计", conf: 0.9}
  - {pattern: "陀螺仪", category: "陀螺仪", conf: 0.9}
  - {pattern: "\\bIMU\\b|惯性测量", category: "IMU（惯性测量装置）", conf: 0.9}
  - {pattern: "电机驱动|步进.*驱动|无刷.*驱动", category: "电机驱动器，控制器", conf: 0.85}
  # 负载开关组里混进来的：分立 MOS 管（"沟槽MOSFET技术…适用于负载开关"）、模拟开关（单刀双掷）、离线反激电源开关（AC-DC）、带电源开关的 ADC、MCU
  - {pattern: "沟槽.{0,6}(MOSFET|MOS)|沟槽技术|(高密|密度)(电池|单元)设计", exclude: "肖特基|二极管|Schottky|IGBT|驱动器", category: "单 FET，MOSFET", conf: 0.85, desc_only: true}
  - {pattern: "单刀|双掷|SPDT|SPST|模拟开关", exclude: "负载开关", category: "接口 > 模拟开关，多路复用器，解复用器", conf: 0.85}
  - {pattern: "离线|反激|原边|初级侧|Offline|Flyback", exclude: "LED|语音|识别", category: "AC DC 转换器，离线开关", conf: 0.85}
  - {pattern: "电源开关|负载开关|配电开关|eFuse|电子保险丝|电子熔丝", exclude: "沟槽|Trench|栅极电荷|单元设计|电池设计|MOSFET技术|单刀|双掷|SPDT|SPST|离线|反激|原边|初级侧|转换器芯片|模/数|ADC|CPU|内核|主频", category: "电源开关，配电开关，负载驱动器", conf: 0.85}
  - {pattern: "固定电感|功率电感|贴片电感", category: "固定电感器", conf: 0.85}
  # 排除稳压器描述里常见的 "针对使用陶瓷电容的操作进行优化 / 可提供 300mA 连续电流"
  - {pattern: "多层陶瓷电容|MLCC|陶瓷电容", exclude: "稳压|LDO|低压差|调节器|输出电压|输出电流|连续电流", category: "陶瓷电容器", conf: 0.9}
  - {pattern: "铝电解电容", category: "铝电解电容器", conf: 0.9}
  - {pattern: "钽电容", category: "钽电容器", conf: 0.9}
  - {pattern: "贴片电阻|厚膜电阻|薄膜电阻|片式电阻", category: "片式贴装电阻器", conf: 0.9}
  - {pattern: "晶体谐振器|无源晶振|石英晶体", category: "晶体（无源晶振）", conf: 0.9}
  - {pattern: "排针", category: "排针", conf: 0.9}
  - {pattern: "排母", category: "排母", conf: 0.9}
  - {pattern: "Type-?C|USB 连接器|USB连接器", exclude: "开关|芯片|控制器|保护|供电|充电|PD|端口控制|DFP|UFP|转换器|驱动", category: "USB连接器", conf: 0.9}   # 芯片描述里的 "USB Type-C 供电应用" 不算连接器

mpn:
  - {manufacturer: "STMicro", pattern: "^STM32", category: "微控制器（MCU）", conf: 0.97}
  - {manufacturer: "STMicro", pattern: "^STM8", category: "微控制器（MCU）", conf: 0.97}
  - {manufacturer: "Texas Instruments", pattern: "^ISO(W)?7", category: "数字隔离器", conf: 0.93}
  - {manufacturer: "Texas Instruments", pattern: "^TPS7", category: "稳压器 - 线性稳压器控制器", conf: 0.7}
  - {manufacturer: "Texas Instruments", pattern: "^TPS(5|6)", category: "稳压器 - DC-DC 开关稳压器", conf: 0.8}
  - {manufacturer: "Texas Instruments", pattern: "^MSP430", category: "微控制器（MCU）", conf: 0.97}
