# 厂商谱系：规范厂商名 + 并购/更名关系。供 IHS 参考数据匹配（ezplm_pilot/ihs.py）使用，也可给 URL 模板等模块复用。
#
# canonical：规范厂商。match 是正则（忽略大小写），对任意写法的厂商名（ezPLM 中文/全称、IHS 大写名）做 search，
#            按顺序取第一条命中，所以更具体的写在前面。没有命中的厂商名按"去掉 INC/CORP/LTD/有限公司 等后缀"规范化后比较。
# lineage  ：被收购/更名的厂商 → 当前归属（to，会再经 canonical 规范化）。
#   from   IHS 里的厂商名（按规范化后精确比较）；match 可选，正则，用于匹配 ezPLM 里的其它写法（如 "Maxim Integrated"）
#   conf   A=整体并购/更名，直接映射；B=业务被拆分，按 rules 里的 IHS 大类映射，未命中用 to；C=需人工确认
#   rules  [{families: IHS 大类正则（ANALOG_IC_AMP/MEMORY_IC/DIODE…，ezPLM 物料按一级分类推断）, to: 当前归属}]
# 来源：IHS 2011-12~2012-02 数据中出现的 177 个厂商名（IHS数据/整合方案/厂商并购映射表.csv），关系按 2026 年已知信息整理，B/C 级需人工确认。

