# 缺符号物料分流：这些分类按"分类 + 引脚数"套 KiCad 官方通用符号即可，不需要找型号专用符号（symgap.py）。
# path：分类路径正则（"一级 > 二级 > …"，new 优先于 orig）；desc：可选，描述/型号再过滤；pins：允许的引脚数（空 = 不限/未知也可）；
# symbol：KiCad 库:符号名，{n} 换成引脚数、{n2} 换成引脚数/2（双排）；conf：建议置信度。按顺序取第一条命中。
# unknown: true 表示拿不到引脚数时也按通用处理（置信度 -0.05）；没有该标记时引脚数未知就算专用。
# 引脚数按封装焊盘数算：TO-252-2/TO-263-2（DPAK/D2PAK）是 2 引线 + 散热片 = 3 个焊盘，不套两脚符号（单管极性随型号，走专用）。
# 不在这里的分类一律算"专用"（specific），走 symmatch 型号匹配。
rules:
  # ---------------- 电阻 / 电位器
  - {path: "^电阻器 > (单个电阻器|片式贴装电阻器|通孔电阻器|底座安装电阻器|特种电阻器)", pins: [2], symbol: "Device:R", unknown: true, conf: 0.92}
  - {path: "^电位计，可变电阻器", pins: [3], symbol: "Device:R_Potentiometer", unknown: true, conf: 0.85}
  # ---------------- 电容
  - {path: "^电容器 > (铝电解电容器|铝聚合物电容器|钽电容器|钽聚合物电容器|超级电容器)", pins: [2], symbol: "Device:C_Polarized", unknown: true, conf: 0.9}
  - {path: "^电容器 > (电容器-单个电容器|陶瓷电容器|薄膜电容器|硅电容器)", pins: [2], symbol: "Device:C", unknown: true, conf: 0.92}
  - {path: "^滤波器 > 馈通式电容器", pins: [3], symbol: "Device:C_Feedthrough", conf: 0.8}
  # ---------------- 电感 / 磁珠
  - {path: "^电感器，线圈，扼流圈 > (单个电感器|固定电感器|可调电感器)", pins: [2], symbol: "Device:L", unknown: true, conf: 0.9}
  - {path: "^滤波器 > 铁氧体磁珠和芯片", pins: [2], symbol: "Device:FerriteBead", unknown: true, conf: 0.9}
  # ---------------- 晶体
  - {path: "^晶体，振荡器，谐振器 > 晶体（无源晶振）", pins: [2], symbol: "Device:Crystal", conf: 0.9}
  - {path: "^晶体，振荡器，谐振器 > 晶体（无源晶振）", pins: [4], symbol: "Device:Crystal_GND24", conf: 0.8}
  # ---------------- 电路保护（两端器件）
  - {path: "^电路保护 > PTC 可复位保险丝", pins: [2], symbol: "Device:Polyfuse", unknown: true, conf: 0.9}
  - {path: "^电路保护 > (保险丝和过流保护|热熔断体（热熔保险丝）)", pins: [2], symbol: "Device:Fuse", unknown: true, conf: 0.88}
  - {path: "^电路保护 > 压敏电阻", pins: [2], symbol: "Device:Varistor", unknown: true, conf: 0.9}
  - {path: "^电路保护 > 瞬态电压抑制器（TVS）", pins: [2], symbol: "Device:D_TVS", conf: 0.85}
  # ---------------- SOT-23 三极管 / MOSFET（只给引脚排列能确定的）
  # 条件同时满足：单管分类 + 封装是 3 脚 SOT-23 + 描述写明极性 + 型号属于"SOT-23 标准引脚"的系列。
  # 标准引脚：三极管 1=B 2=E 3=C，MOSFET 1=G 2=S 3=D。日系（2SC/2SA/罗姆 SST/UMT 等）排列不统一，不在名单里，走专用匹配。
  # 符号用平台自带的 platform:Q_*（config/generic_symbols/，KiCad 现行库的 Q_NPN/Q_NMOS 引脚编号是字母，对不上数字焊盘）。
  - {path: "单双极晶体管", desc: "(?<![A-Za-z])NPN(?![A-Za-z])", exclude: "PNP|双|Dual|阵列|预偏置|数字|带电阻|达林顿", mpn: "^(MMBTA?\\d|PMBT\\d|FMMT\\d|BC8[0-9]{2}|BCX7\\d|BCW[0-9]{2})",
     pkg: "(?<![A-Za-z0-9])SOT-?23(-3)?(?![-\\d])", pins: [3], symbol: "platform:Q_NPN_BEC", conf: 0.86}
  - {path: "单双极晶体管", desc: "(?<![A-Za-z])PNP(?![A-Za-z])", exclude: "NPN|双|Dual|阵列|预偏置|数字|带电阻|达林顿", mpn: "^(MMBTA?\\d|PMBT\\d|FMMT\\d|BC8[0-9]{2}|BCX7\\d|BCW[0-9]{2})",
     pkg: "(?<![A-Za-z0-9])SOT-?23(-3)?(?![-\\d])", pins: [3], symbol: "platform:Q_PNP_BEC", conf: 0.86}
  - {path: "单 FET，MOSFET", desc: "N ?沟道|N-?Channel|N型|NMOS", exclude: "P ?沟道|P-?Channel|双|Dual|互补", mpn: "^(2N7002|BSS138|BSS123|AO34[0-2]\\d|SI23\\d{2}|IRLML\\d|NTR\\d{4}|PMV\\d{2}|NX(3008|7002)|DMG(23|34)|DMN\\d{2,4}|FDN3\\d{2}|FDV30\\d)",
     pkg: "(?<![A-Za-z0-9])SOT-?23(-3)?(?![-\\d])", pins: [3], symbol: "platform:Q_NMOS_GSD", conf: 0.86}
  - {path: "单 FET，MOSFET", desc: "P ?沟道|P-?Channel|P型|PMOS", exclude: "N ?沟道|N-?Channel|双|Dual|互补", mpn: "^(BSS84|AO34[0-2]\\d|SI23\\d{2}|IRLML\\d|NTR\\d{4}|PMV\\d{2}|DMG(23|34)|DMP\\d{2,4}|FDN3\\d{2}|FDV30\\d)",
     pkg: "(?<![A-Za-z0-9])SOT-?23(-3)?(?![-\\d])", pins: [3], symbol: "platform:Q_PMOS_GSD", conf: 0.86}
  # ---------------- 两脚二极管 / LED（多脚、阵列的走专用）
  - {path: "^分立半导体产品 > 二极管(?!.*(阵列|桥))", desc: "肖特基|Schottky", exclude: "阵列|双|Dual|共阴|共阳|Array|桥", pins: [2], symbol: "Device:D_Schottky", conf: 0.88}
  - {path: "^分立半导体产品 > 二极管(?!.*(阵列|桥))", desc: "齐纳|稳压|Zener", exclude: "阵列|双|Dual|共阴|共阳|Array|桥", pins: [2], symbol: "Device:D_Zener", conf: 0.88}
  - {path: "^分立半导体产品 > 二极管(?!.*(阵列|桥))", desc: "TVS|瞬态", exclude: "阵列|双|Dual|共阴|共阳|Array|桥", pins: [2], symbol: "Device:D_TVS", conf: 0.85}
  - {path: "^分立半导体产品 > 二极管(?!.*(阵列|桥))", exclude: "阵列|双|Dual|共阴|共阳|Array|桥", pins: [2], symbol: "Device:D", conf: 0.85}
  - {path: "^光电器件 > LED 发射器", pins: [2], symbol: "Device:LED", conf: 0.88}
  # ---------------- 排针 / 排母（单排按引脚数；双排要求封装或描述里写明 2xNN）
  - {path: "^连接器，互连器件 > (排针|排母)", desc: "2[xX×*]\\d+|双排", pins: [], symbol: "Connector_Generic:Conn_02x{n2}_Odd_Even", conf: 0.8}
  - {path: "^连接器，互连器件 > (排针|排母)", pins: [], symbol: "Connector_Generic:Conn_01x{n}", conf: 0.8}
  # ---------------- 两脚轻触开关
  - {path: "^开关 > (轻触开关|按键开关)", pins: [2], symbol: "Switch:SW_Push", conf: 0.85}
