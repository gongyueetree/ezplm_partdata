  - {pattern: "^LQFP-?32$", kicad: "Package_QFP:LQFP-32_7x7mm_P0.8mm", conf: 0.8}
  - {pattern: "^LQFP-?48$", kicad: "Package_QFP:LQFP-48_7x7mm_P0.5mm", conf: 0.8}
  - {pattern: "^LQFP-?64$", kicad: "Package_QFP:LQFP-64_10x10mm_P0.5mm", conf: 0.8}
  - {pattern: "^LQFP-?100$", kicad: "Package_QFP:LQFP-100_14x14mm_P0.5mm", conf: 0.8}
  - {pattern: "^LQFP-?144$", kicad: "Package_QFP:LQFP-144_20x20mm_P0.5mm", conf: 0.8}
  - {pattern: "^0201$|^0603M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_0201_0603Metric", conf: 0.7}
  - {pattern: "^0402$|^1005M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_0402_1005Metric", conf: 0.7}
  - {pattern: "^0603$|^1608M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_0603_1608Metric", conf: 0.7}
  - {pattern: "^0805$|^2012M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_0805_2012Metric", conf: 0.7}
  - {pattern: "^1206$|^3216M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_1206_3216Metric", conf: 0.7}
  - {pattern: "^1210$|^3225M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_1210_3225Metric", conf: 0.7}
  - {pattern: "^2512$|^6332M$", roots: ["电阻器","电容器","电感器，线圈，扼流圈","电路保护"], kicad: "Resistor_SMD:R_2512_6332Metric", conf: 0.7}
# 片式尺寸码对电阻/电容/电感要按分类换前缀：R_ / C_ / L_（代码里按分类根替换）
chip_prefix_by_root:
  电阻器: "Resistor_SMD:R_"
  电容器: "Capacitor_SMD:C_"
  电感器，线圈，扼流圈: "Inductor_SMD:L_"
  电路保护: "Fuse:Fuse_"
