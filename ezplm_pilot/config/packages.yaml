# 通用封装名（器件"封装"属性 / 描述里出现的叫法）→ KiCad 官方封装名。
# 用于"通用封装直接映射"这一层：不需要逐器件去找工程文件。
# pattern 为正则（忽略大小写）；kicad 为 KiCad 封装库:封装名；conf 为置信度。
# 同一器件可能命中多条，取第一条命中。roots 限定只对这些一级分类生效（避免 "SMA" 连接器被当成二极管封装）。
rules:
  - {pattern: "^SOT-?23-?3?$|^SOT23$|\\bSOT-23\\b(?!-[56])", kicad: "Package_TO_SOT_SMD:SOT-23", conf: 0.95}
  - {pattern: "^SOT-?23-?5$|\\bSOT-23-5\\b|\\bSOT23-5\\b", kicad: "Package_TO_SOT_SMD:SOT-23-5", conf: 0.95}
  - {pattern: "^SOT-?23-?6$|\\bSOT-23-6\\b|\\bSOT23-6\\b", kicad: "Package_TO_SOT_SMD:SOT-23-6", conf: 0.95}
  - {pattern: "^SOT-?223(-3)?$|\\bSOT-223\\b", kicad: "Package_TO_SOT_SMD:SOT-223-3_TabPin2", conf: 0.9}
  - {pattern: "^SOT-?89(-3)?$", kicad: "Package_TO_SOT_SMD:SOT-89-3", conf: 0.9}
  - {pattern: "^SOT-?363$|^SC-?70-?6$", kicad: "Package_TO_SOT_SMD:SOT-363_SC-70-6", conf: 0.95}
  - {pattern: "^SOT-?353$|^SC-?70-?5$", kicad: "Package_TO_SOT_SMD:SOT-353_SC-70-5", conf: 0.95}
  - {pattern: "^SOT-?323$|^SC-?70(-3)?$", kicad: "Package_TO_SOT_SMD:SOT-323_SC-70", conf: 0.95}
  - {pattern: "^SOD-?123$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SOD-123", conf: 0.95}
  - {pattern: "^SOD-?123F(L)?$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SOD-123F", conf: 0.95}
  - {pattern: "^SOD-?323$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SOD-323", conf: 0.95}
  - {pattern: "^SOD-?523$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SOD-523", conf: 0.95}
  - {pattern: "^SOD-?80$|^MiniMELF$|^LL-?34$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_MiniMELF", conf: 0.9}
  - {pattern: "^DO-?34$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_THT:D_DO-34_SOD68_P7.62mm_Horizontal", conf: 0.75}
  - {pattern: "^DO-?35$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_THT:D_DO-35_SOD27_P7.62mm_Horizontal", conf: 0.75}
  - {pattern: "^DO-?41$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_THT:D_DO-41_SOD81_P10.16mm_Horizontal", conf: 0.75}
  - {pattern: "^DO-?213AB$|^MELF$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_MELF", conf: 0.9}
  - {pattern: "^SMA$|^DO-?214AC$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SMA", conf: 0.95}
  - {pattern: "^SMB$|^DO-?214AA$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SMB", conf: 0.95}
  - {pattern: "^SMC$|^DO-?214AB$", roots: ["分立半导体产品","电路保护"], kicad: "Diode_SMD:D_SMC", conf: 0.95}
  - {pattern: "^TO-?252(-2)?$|^DPAK$|\\bDPAK\\b", kicad: "Package_TO_SOT_SMD:TO-252-2", conf: 0.9}
  - {pattern: "^TO-?263(-2)?$|^D2PAK$|\\bD2PAK\\b", kicad: "Package_TO_SOT_SMD:TO-263-2", conf: 0.9}
  - {pattern: "^TO-?220(-3)?$", kicad: "Package_TO_SOT_THT:TO-220-3_Vertical", conf: 0.8}
  - {pattern: "^TO-?247(-3)?$", kicad: "Package_TO_SOT_THT:TO-247-3_Vertical", conf: 0.8}
  - {pattern: "^TO-?92(-3)?$", kicad: "Package_TO_SOT_THT:TO-92_Inline", conf: 0.8}
