  - {pattern: "^TSSOP-?8$|^8-?TSSOP$", kicad: "Package_SO:TSSOP-8_3x4.4mm_P0.65mm", conf: 0.9}
  - {pattern: "^TSSOP-?14$|^14-?TSSOP$", kicad: "Package_SO:TSSOP-14_4.4x5mm_P0.65mm", conf: 0.9}
  - {pattern: "^TSSOP-?16$|^16-?TSSOP$", kicad: "Package_SO:TSSOP-16_4.4x5mm_P0.65mm", conf: 0.9}
  - {pattern: "^TSSOP-?20$|^20-?TSSOP$", kicad: "Package_SO:TSSOP-20_4.4x6.5mm_P0.65mm", conf: 0.9}
  - {pattern: "^TSSOP-?24$|^24-?TSSOP$", kicad: "Package_SO:TSSOP-24_4.4x7.8mm_P0.65mm", conf: 0.9}
  - {pattern: "^MSOP-?8$|^8-?MSOP$", kicad: "Package_SO:MSOP-8_3x3mm_P0.65mm", conf: 0.9}
  - {pattern: "^MSOP-?10$|^10-?MSOP$", kicad: "Package_SO:MSOP-10_3x3mm_P0.5mm", conf: 0.9}
  - {pattern: "^SSOP-?16$", kicad: "Package_SO:SSOP-16_3.9x4.9mm_P0.635mm", conf: 0.8}
  - {pattern: "^DIP-?8$|^PDIP-?8$", kicad: "Package_DIP:DIP-8_W7.62mm", conf: 0.9}
